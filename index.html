<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bot Multi-Client</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#17212B">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0E1621; color: #FFFFFF; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Шапка */
    header { background-color: #17212B; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #0B1118; height: 56px; }
    .header-title { font-weight: 600; font-size: 16px; }
    .header-subtitle { font-size: 12px; color: #7F91A4; }
    .icon-btn { background: none; border: none; color: #64B5F6; font-size: 18px; cursor: pointer; padding: 6px; }

    /* Экран Входа / Управления ботами */
    #auth-screen { padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .auth-box { width: 100%; max-width: 360px; text-align: center; }
    input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #242F3D; background: #17212B; color: #fff; font-size: 14px; margin: 8px 0; outline: none; }
    .btn-primary { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #5288C1; color: #fff; font-weight: 600; cursor: pointer; }
    .bot-list-item { background: #17212B; padding: 10px; margin: 6px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }

    /* Список диалогов (Главный экран) */
    #dialogs-screen { display: none; flex-direction: column; height: 100%; }
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { display: flex; align-items: center; padding: 12px 16px; background: #17212B; border-bottom: 1px solid #0E1621; cursor: pointer; }
    .chat-item:active { background: #202B36; }
    .avatar { width: 46px; height: 46px; border-radius: 50%; background: #5288C1; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px; flex-shrink: 0; }
    .chat-info { flex: 1; min-width: 0; }
    .chat-name { font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
    .chat-time { font-size: 11px; color: #7F91A4; font-weight: normal; }
    .chat-preview-row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .chat-preview { font-size: 13px; color: #7F91A4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .badge { background: #5288C1; color: #fff; font-size: 11px; font-weight: bold; padding: 2px 7px; border-radius: 12px; margin-left: 8px; }

    /* Экран переписки */
    #chat-room { display: none; flex-direction: column; height: 100%; position: absolute; top:0; left:0; right:0; bottom:0; background: #0E1621; z-index: 10; }
    .messages-container { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    
    .msg-bubble { padding: 8px 12px; border-radius: 12px; max-width: 82%; word-break: break-word; font-size: 14px; line-height: 1.3; cursor: pointer; position: relative; }
    .msg-in { background: #182533; align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg-out { background: #2B5278; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg-meta { font-size: 10px; color: #7F91A4; text-align: right; margin-top: 4px; }

    /* Вложенный ответ внутри сообщения */
    .reply-quote { background: rgba(0,0,0,0.2); border-left: 3px solid #64B5F6; padding: 4px 8px; margin-bottom: 6px; border-radius: 4px; font-size: 12px; color: #B0BEC5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Плашка ответа над полем ввода */
    #reply-preview-bar { display: none; background: #17212B; padding: 6px 12px; border-top: 1px solid #0B1118; border-left: 3px solid #64B5F6; align-items: center; justify-content: space-between; font-size: 12px; }
    #reply-preview-text { color: #B0BEC5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 85%; }

    /* Поле ввода */
    .input-bar { background: #17212B; padding: 8px 12px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #0B1118; }
    .input-bar input { flex: 1; margin: 0; }

    .empty-state { text-align: center; color: #7F91A4; margin-top: 50px; font-size: 14px; }
  </style>
</head>
<body>

  <!-- 1. Экран авторизации -->
  <div id="auth-screen">
    <div class="auth-box">
      <h2>Мои Бот-Аккаунты</h2>
      <div id="saved-bots-list" style="margin: 15px 0;"></div>
      <input type="text" id="token-input" placeholder="Вставьте API Token бота">
      <input type="text" id="bot-name-input" placeholder="Название бота">
      <button class="btn-primary" onclick="addBot()">Добавить бота</button>
    </div>
  </div>

  <!-- 2. Главный экран: Чаты -->
  <div id="dialogs-screen">
    <header>
      <button class="icon-btn" onclick="openBotSelector()">🤖 Боты</button>
      <div>
        <div class="header-title" id="active-bot-title">Чат Бот</div>
        <div class="header-subtitle" id="status-text">Соединение...</div>
      </div>
      <button class="icon-btn" onclick="clearAllData()" title="Сбросить всё">🗑️</button>
    </header>

    <div class="chat-list" id="dialogs-container">
      <div class="empty-state">Нет активных диалогов</div>
    </div>
  </div>

  <!-- 3. Экран комнаты чата -->
  <div id="chat-room">
    <header>
      <button class="icon-btn" onclick="goBackToDialogs()">◀ Назад</button>
      <div style="flex:1; margin-left:10px;">
        <div class="header-title" id="room-user-name">Пользователь</div>
        <div class="header-subtitle" id="room-user-username">@username</div>
      </div>
      <button class="icon-btn" id="mute-btn" onclick="toggleMuteChat()">🔔</button>
      <button class="icon-btn" onclick="deleteCurrentChat()" style="color:#e53935;">🗑️</button>
    </header>

    <div class="messages-container" id="room-messages"></div>

    <!-- Плашка при ответе на конкретное сообщение -->
    <div id="reply-preview-bar">
      <div>
        <div style="color: #64B5F6; font-weight: bold;">Ответ на сообщение:</div>
        <div id="reply-preview-text">...</div>
      </div>
      <button class="icon-btn" onclick="cancelReplyQuote()" style="font-size:14px; color:#aaa;">✕</button>
    </div>

    <div class="input-bar">
      <input type="text" id="reply-input" placeholder="Написать ответ..." onkeypress="handleKeyPress(event)">
      <button class="icon-btn" onclick="sendReply()">Отправить</button>
    </div>
  </div>

  <script>
    let bots = JSON.parse(localStorage.getItem('app_bots') || '[]');
    let activeBotToken = localStorage.getItem('app_active_token') || '';
    let db = JSON.parse(localStorage.getItem('app_db_v3') || '{}'); 

    let currentChatId = null;
    let selectedReplyMsgId = null;
    let pollInterval = null;

    /* --- Обработка кнопки «Назад» телефона --- */
    window.addEventListener('popstate', (e) => {
      if (currentChatId) {
        closeChatRoomUI();
      }
    });

    window.onload = () => {
      if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
      }

      if (activeBotToken && bots.some(b => b.token === activeBotToken)) {
        showDialogsScreen();
      } else {
        renderAuthBotsList();
      }
    };

    /* --- Управление ботами --- */
    function addBot() {
      const token = document.getElementById('token-input').value.trim();
      const name = document.getElementById('bot-name-input').value.trim() || 'Бот ' + (bots.length + 1);
      
      if (!token) return alert('Введите токен');
      if (bots.some(b => b.token === token)) return alert('Этот бот уже добавлен');

      bots.push({ name, token });
      localStorage.setItem('app_bots', JSON.stringify(bots));
      activeBotToken = token;
      localStorage.setItem('app_active_token', token);

      document.getElementById('token-input').value = '';
      document.getElementById('bot-name-input').value = '';
      showDialogsScreen();
    }

    function selectBot(token) {
      activeBotToken = token;
      localStorage.setItem('app_active_token', token);
      showDialogsScreen();
    }

    function renderAuthBotsList() {
      const container = document.getElementById('saved-bots-list');
      container.innerHTML = bots.map(b => `
        <div class="bot-list-item">
          <span><b>${escapeHtml(b.name)}</b></span>
          <button class="btn-primary" style="width:auto; padding:6px 12px;" onclick="selectBot('${b.token}')">Войти</button>
        </div>
      `).join('');
    }

    function openBotSelector() {
      clearInterval(pollInterval);
      document.getElementById('dialogs-screen').style.display = 'none';
      document.getElementById('auth-screen').style.display = 'flex';
      renderAuthBotsList();
    }

    /* --- Работа с чатами --- */
    function showDialogsScreen() {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('dialogs-screen').style.display = 'flex';
      
      const currentBot = bots.find(b => b.token === activeBotToken);
      document.getElementById('active-bot-title').innerText = currentBot ? currentBot.name : 'Чат Бот';

      if (!db[activeBotToken]) db[activeBotToken] = {};

      renderDialogsList();
      startPolling();
    }

    function startPolling() {
      clearInterval(pollInterval);
      fetchUpdates();
      pollInterval = setInterval(fetchUpdates, 3000);
    }

    async function fetchUpdates() {
      if (!activeBotToken) return;

      const lastUpdateId = localStorage.getItem(`last_upd_${activeBotToken}`) || 0;
      const url = `https://api.telegram.org/bot${activeBotToken}/getUpdates?offset=${Number(lastUpdateId) + 1}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.ok && data.result.length > 0) {
          data.result.forEach(update => {
            if (update.message) {
              saveIncomingMessage(update.message);
            }
            localStorage.setItem(`last_upd_${activeBotToken}`, update.update_id);
          });

          saveDB();
          renderDialogsList();
          if (currentChatId) renderMessagesInRoom(currentChatId);
        }
        document.getElementById('status-text').innerText = 'Онлайн';
      } catch (e) {
        document.getElementById('status-text').innerText = 'Ошибка сети';
      }
    }

    function saveIncomingMessage(msg) {
      const chatId = msg.chat.id;
      const botDb = db[activeBotToken];

      if (!botDb[chatId]) {
        botDb[chatId] = {
          user: {
            name: `${msg.from.first_name || ''} ${msg.from.last_name || ''}`.trim() || 'Пользователь',
            username: msg.from.username ? `@${msg.from.username}` : 'без юзернейма'
          },
          muted: false,
          unreadCount: 0,
          messages: []
        };
      }

      const isDuplicate = botDb[chatId].messages.some(m => m.id === msg.message_id);
      if (!isDuplicate) {
        const newMsg = {
          id: msg.message_id,
          type: 'in',
          text: msg.text || '[Медиа/Вложение]',
          replyToText: msg.reply_to_message ? (msg.reply_to_message.text || '[Вложение]') : null,
          time: new Date(msg.date * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        botDb[chatId].messages.push(newMsg);

        // Увеличиваем счетчик непрочитанных, если открыт другой чат
        if (currentChatId !== String(chatId)) {
          botDb[chatId].unreadCount = (botDb[chatId].unreadCount || 0) + 1;
        }

        if (!botDb[chatId].muted && Notification.permission === "granted") {
          new Notification(botDb[chatId].user.name, { body: newMsg.text });
        }
      }
    }

    function renderDialogsList() {
      const container = document.getElementById('dialogs-container');
      const botDb = db[activeBotToken] || {};
      const chatIds = Object.keys(botDb);

      if (chatIds.length === 0) {
        container.innerHTML = `<div class="empty-state">Пока никто не писал этому боту</div>`;
        return;
      }

      chatIds.sort((a, b) => {
        const lastA = botDb[a].messages[botDb[a].messages.length - 1];
        const lastB = botDb[b].messages[botDb[b].messages.length - 1];
        return (lastB ? lastB.id : 0) - (lastA ? lastA.id : 0);
      });

      container.innerHTML = chatIds.map(id => {
        const chat = botDb[id];
        const lastMsg = chat.messages[chat.messages.length - 1] || { text: 'Нет сообщений', time: '' };
        const letter = chat.user.name.charAt(0).toUpperCase();
        const unread = chat.unreadCount || 0;
        
        return `
          <div class="chat-item" onclick="openChatRoom('${id}')">
            <div class="avatar">${letter}</div>
            <div class="chat-info">
              <div class="chat-name">
                <span>${escapeHtml(chat.user.name)} ${chat.muted ? '🔕' : ''}</span>
                <span class="chat-time">${lastMsg.time}</span>
              </div>
              <div class="chat-preview-row">
                <div class="chat-preview">${escapeHtml(lastMsg.text)}</div>
                ${unread > 0 ? `<div class="badge">${unread}</div>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    /* --- Комната чата --- */
    function openChatRoom(chatId) {
      currentChatId = String(chatId);
      const chat = db[activeBotToken][chatId];

      // Сбрасываем счетчик непрочитанных при входе
      chat.unreadCount = 0;
      saveDB();

      document.getElementById('room-user-name').innerText = chat.user.name;
      document.getElementById('room-user-username').innerText = chat.user.username;
      updateMuteButtonUI(chat.muted);

      renderMessagesInRoom(chatId);
      document.getElementById('chat-room').style.display = 'flex';

      // Добавляем запись в историю для корректной работы системной кнопки "Назад"
      history.pushState({ page: 'chat' }, '', '#chat');
    }

    function goBackToDialogs() {
      if (currentChatId) {
        history.back(); // Вызывает событие popstate, закрывающее чат
      }
    }

    function closeChatRoomUI() {
      currentChatId = null;
      cancelReplyQuote();
      document.getElementById('chat-room').style.display = 'none';
      renderDialogsList();
    }

    function renderMessagesInRoom(chatId) {
      const container = document.getElementById('room-messages');
      const chat = db[activeBotToken][chatId];
      if (!chat) return;

      container.innerHTML = chat.messages.map(m => `
        <div class="msg-bubble ${m.type === 'in' ? 'msg-in' : 'msg-out'}" onclick="setReplyQuote(${m.id}, '${escapeHtml(m.text)}')">
          ${m.replyToText ? `<div class="reply-quote">${escapeHtml(m.replyToText)}</div>` : ''}
          <div>${escapeHtml(m.text)}</div>
          <div class="msg-meta">${m.time}</div>
        </div>
      `).join('');

      container.scrollTop = container.scrollHeight;
    }

    /* --- Ответ на конкретное сообщение --- */
    function setReplyQuote(msgId, text) {
      selectedReplyMsgId = msgId;
      document.getElementById('reply-preview-text').innerText = text;
      document.getElementById('reply-preview-bar').style.display = 'flex';
      document.getElementById('reply-input').focus();
    }

    function cancelReplyQuote() {
      selectedReplyMsgId = null;
      document.getElementById('reply-preview-bar').style.display = 'none';
    }

    async function sendReply() {
      const input = document.getElementById('reply-input');
      const text = input.value.trim();
      if (!text || !currentChatId) return;

      const url = `https://api.telegram.org/bot${activeBotToken}/sendMessage`;
      const payload = {
        chat_id: currentChatId,
        text: text
      };

      // Если выбран ответ на конкретное сообщение
      if (selectedReplyMsgId) {
        payload.reply_to_message_id = selectedReplyMsgId;
      }

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const data = await res.json();
        if (data.ok) {
          const chat = db[activeBotToken][currentChatId];
          
          let quoteText = null;
          if (selectedReplyMsgId) {
            const orig = chat.messages.find(m => m.id === selectedReplyMsgId);
            if (orig) quoteText = orig.text;
          }

          chat.messages.push({
            id: data.result.message_id,
            type: 'out',
            text: text,
            replyToText: quoteText,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });

          saveDB();
          renderMessagesInRoom(currentChatId);
          input.value = '';
          cancelReplyQuote();
        } else {
          alert('Ошибка отправки: ' + data.description);
        }
      } catch (e) {
        alert('Не удалось отправить сообщение');
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendReply();
    }

    /* --- Настройки --- */
    function toggleMuteChat() {
      if (!currentChatId) return;
      const chat = db[activeBotToken][currentChatId];
      chat.muted = !chat.muted;
      saveDB();
      updateMuteButtonUI(chat.muted);
    }

    function updateMuteButtonUI(isMuted) {
      document.getElementById('mute-btn').innerText = isMuted ? '🔕' : '🔔';
    }

    function deleteCurrentChat() {
      if (confirm('Удалить этот чат с устройства?')) {
        delete db[activeBotToken][currentChatId];
        saveDB();
        goBackToDialogs();
      }
    }

    function clearAllData() {
      if (confirm('Сбросить все сохранённые данные?')) {
        localStorage.clear();
        location.reload();
      }
    }

    function saveDB() {
      localStorage.setItem('app_db_v3', JSON.stringify(db));
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/'/g, "&#39;");
    }
  </script>
</body>
</html>
